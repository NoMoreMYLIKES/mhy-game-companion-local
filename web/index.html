<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Game Companion Local</title>
  <meta name="description" content="Local stamina planning and farming automation for Genshin Impact and Zenless Zone Zero.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23d52b1e'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the first paint (no flash of the wrong theme).
    try {
      var theme = localStorage.getItem('gcl_theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (_) {}
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip_link">Skip to content</a>

  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/today">
        <span class="mark" aria-hidden="true"></span>
        <span id="brand-title">Game Companion</span>
        <small id="brand-edition">Local</small>
      </a>
      <nav class="tabs" id="tabs" aria-label="Sections"></nav>
      <div class="top-tools">
        <div class="seg lang" role="group" id="lang-switch" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh-CN">中文</button>
        </div>
        <details class="menu" id="theme-menu"></details>
      </div>
    </div>
    <div class="strip">
      <div class="strip-inner" id="status-strip" aria-live="polite">Connecting to the backend…</div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section id="view-today" aria-labelledby="tab-today"></section>
    <section id="view-goals" aria-labelledby="tab-goals" hidden></section>
    <section id="view-plan" aria-labelledby="tab-plan" hidden></section>
    <section id="view-runs" aria-labelledby="tab-runs" hidden></section>
    <section id="view-settings" aria-labelledby="tab-settings" hidden></section>
  </main>

  <div class="savebar" id="savebar" hidden></div>
  <dialog id="modal" class="modal-shell" aria-labelledby="modal-title"></dialog>
  <div id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
