<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Companion · Local</title>
  <meta name="description" content="Local cultivation planning, stamina management, and automated execution for Genshin Impact and Zenless Zone Zero.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1 id="brand-title">Game Companion</h1>
        <small id="brand-edition">Local</small>
      </div>
      <div class="header-right">
        <div class="lang-switch" role="group" aria-label="Language selection">
          <button type="button" data-lang="en" id="btn-lang-en" class="active">EN</button>
          <span aria-hidden="true">/</span>
          <button type="button" data-lang="zh" id="btn-lang-zh">中文</button>
        </div>
        <nav role="tablist" aria-label="Navigation">
          <button role="tab" id="tab-today" data-tab="today" aria-selected="true" data-i18n="tab_today">Today</button>
          <button role="tab" id="tab-goals" data-tab="goals" aria-selected="false" data-i18n="tab_goals">Goals</button>
          <button role="tab" id="tab-plan" data-tab="plan" aria-selected="false" data-i18n="tab_plan">Schedule</button>
          <button role="tab" id="tab-runs" data-tab="runs" aria-selected="false" data-i18n="tab_runs">Runs</button>
          <button role="tab" id="tab-settings" data-tab="settings" aria-selected="false" data-i18n="tab_settings">Settings</button>
        </nav>
      </div>
      <div class="status-line" id="status-line">Connecting to backend…</div>
    </div>
  </header>

  <main>
    <section id="view-today" role="tabpanel" aria-labelledby="tab-today"></section>
    <section id="view-goals" role="tabpanel" aria-labelledby="tab-goals" hidden></section>
    <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
    <section id="view-runs" role="tabpanel" aria-labelledby="tab-runs" hidden></section>
    <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
